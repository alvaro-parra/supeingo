<!-- ─── Cache-busting ───────────────────────────────────────────
     GitHub Pages cachea con max-age=600. Para invalidar al instante,
     bumpea ?v=N en cada asset local cuando hagas deploy con cambios.
     Las CDN externas (unpkg) ya están pinneadas por versión + integrity. -->
<script src="data/validate.js?v=1"></script>
<!-- dictionary primero: alphabet.js hidrata sus emojis/sílabas desde aquí -->

<body>
<div id="app"></div>

<!--
  Diagnóstico móvil: si algo falla antes de que React monte, queda un
  rastro visible en la propia página. Pinta los errores en un overlay
  en la parte inferior (rojo = error, naranja = warning). Útil sobre
  todo en Chrome Android, donde no se puede abrir consola sin USB.
  Se quita solo cuando React monta correctamente.
-->
<div id="boot-log" style="
  position: fixed; left: 0; right: 0; bottom: 0;
  max-height: 50vh; overflow: auto;
  background: rgba(20,20,24,0.95); color: #f4f4f6;
  font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
  padding: 8px 12px; z-index: 99999;
  border-top: 2px solid #fda4af;
  display: none;
"></div>
<script>
(function () {
  var box = document.getElementById("boot-log");
  function show() { if (box) box.style.display = "block"; }
  function add(kind, msg) {
    show();
    var line = document.createElement("div");
    line.style.color = kind === "error" ? "#fca5a5" : "#fcd34d";
    line.style.padding = "2px 0";
    line.style.borderBottom = "1px dashed #3a3a45";
    line.textContent = "[" + kind + "] " + msg;
    box.appendChild(line);
  }
  window.addEventListener("error", function (e) {
    var src = e.filename ? e.filename.split("/").pop() : "";
    add("error", (e.message || "Error") + (src ? " — " + src + ":" + (e.lineno || "?") : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    add("error", "Promise rechazada: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  // Si tras 8s seguimos sin nada renderizado, avisamos.
  setTimeout(function () {
    var app = document.getElementById("app");
    if (app && !app.firstChild) {
      add("warn", "La app no se ha montado en 8s. Babel transpilando o algún script bloqueado.");
    } else if (box) {
      // Todo OK — ocultamos el overlay.
      box.style.display = "none";
    }
  }, 8000);
})();
</script>
